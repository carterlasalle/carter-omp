[fetch_pr]
description = "Fetch the inbound PR premise and changed-file list for review. Review-mode only."

[classify_pr]
description = "Classify and rank an incoming PR, apply triaged/review labels, and persist the rank. Review-mode only."

[classify_pr.parameters]
rank = "Required review verdict label: one of `review:p0..p3`."
type = "Exactly one PR type: feat, fix, docs, refactor, perf, test, chore, ci, or build."
area = "Zero or more functional labels. Unknown values are dropped silently; omit when none apply."
provider = "Only when provider-scoped; format `provider:<name>`. Omit otherwise."
rationale = "One sentence explaining what the PR changes and why it earns this rank."

[pr_review_comment]
description = "Stage one inline PR review comment in sqlite. Does not call GitHub until submit_pr_review. Review-mode only."

[pr_review_comment.parameters]
path = "Changed file path to comment on."
line = "Line number in the PR diff."
body = "Markdown body for one concrete finding."
side = "`RIGHT` for added/changed lines, `LEFT` for removed lines. Defaults to `RIGHT`."
start_line = "Optional first line for a multi-line comment range."
start_side = "Optional side for start_line; `RIGHT` or `LEFT`."

[submit_pr_review]
description = "Submit one GitHub PR review with all staged inline comments. Always posts event=`COMMENT`; never approves or requests changes. Review-mode only."

[submit_pr_review.parameters]
body = "Markdown review summary. Required even when there are no inline comments."
event = "Ignored except for schema compatibility; the orchestrator always sends `COMMENT`."

[list_staged_pr_review_comments]
description = "List staged inline PR review comments for this issue, oldest first. Read-only; review-mode only."

[get_staged_pr_review_comment]
description = "Fetch one staged inline PR review comment by id. Read-only; review-mode only."

[get_staged_pr_review_comment.parameters]
id = "Staged comment id from list_staged_pr_review_comments."

[update_staged_pr_review_comment]
description = "Edit one staged inline PR review comment in place. Omitted fields keep their values; explicit null start_line/start_side clears the range. Revalidates the anchor against the PR diff. Review-mode only."

[update_staged_pr_review_comment.parameters]
id = "Staged comment id from list_staged_pr_review_comments."
path = "Changed file path to comment on. Omit to keep the current value."
line = "Line number in the PR diff. Omit to keep the current value."
side = "`RIGHT` for added/changed lines, `LEFT` for removed lines. Omit to keep the current value."
body = "Markdown body for one concrete finding. Omit to keep the current value."
start_line = "First line for a multi-line comment range. Explicit null clears the range."
start_side = "Side for start_line; `RIGHT` or `LEFT`. Explicit null clears the range."

[unstage_pr_review_comment]
description = "Delete one staged inline PR review comment by id. Review-mode only."

[unstage_pr_review_comment.parameters]
id = "Staged comment id from list_staged_pr_review_comments."

[clear_staged_pr_review_comments]
description = "Delete all staged inline PR review comments for this issue. Review-mode only."

[preview_pr_review]
description = "Preview the submit-time view of staged inline comments: anchorable inline set, excluded set with reasons, and head validation. Read-only: performs zero DB writes and zero GitHub writes. Review-mode only."

# trace:v1 id=ops.host-tool-report-pain-point work=WORK-CO-Q8Z1HJJJ satisfies=REQ-CO-9N23MPRP
[report_pain_point]
description = "Vent any annoyance or pain point you hit in this run — the harness, a tool, a gate, the instructions, anything that made the work harder than it should have been. Opens one issue on the carter-omp repo, labelled for triage, deduped by title so a repeat appends evidence instead of filing another. Use it whenever something feels wrong, not just when something breaks. WANT: `bun check` passes locally but the push gate rejects with a different error (gate/reality mismatch); a tool description promises X but the call does Y; the third run in a row lost 10 minutes to the same confusing retry; these instructions told you to do something that turned out to be wrong. DO NOT WANT: narrating normal work (`I had to think for a moment`); restating the task; speculation about internals you cannot see; defects in the repo you are working on (those are the job, not a report). Max 3 per issue — spend them on what stung most."

# trace:v1 id=ops.host-tool-report-pain-point-parameters work=WORK-CO-Q8Z1HJJJ satisfies=REQ-CO-9N23MPRP
[report_pain_point.parameters]
title = "One-line, specific summary of the annoyance (imperative or noun phrase, e.g. `gh_push_branch rejects a renamed workspace branch`)."
details = "Markdown: what you expected, what happened, the exact error text, and what you tried. Facts only; no speculation about internals you cannot see."
severity = "`low` (annoyance), `medium` (default: wasted effort or a misleading failure), `high` (blocked publication or lost work)."
area = "Optional short bucket: `harness`, `tool`, `gate`, `infra`, `docs`, `prompt`."

# trace:v1 id=ops.host-tool-record-solution work=WORK-CO-Q8Z1HJJJ satisfies=REQ-CO-9N23MPRP
[record_solution]
description = "Write down what this run learned the hard way so the next run facing the same wall gets the answer at kickoff instead of re-deriving it. Call it when you burned real effort on something a short note would have skipped: state WHEN the next run should receive this (`trigger`: the situation in the next run's own words) and WHAT to inject (`body`: the answer, commands, paths, gotchas — concrete, under a paragraph). WANT: `trigger: bun check passes but push gate rejects with a different tsc error` + the actual cause/fix you found. DO NOT WANT: restating the task, narrating the whole run, speculation, anything already obvious from the repo docs."

# trace:v1 id=ops.host-tool-record-solution-parameters work=WORK-CO-Q8Z1HJJJ satisfies=REQ-CO-9N23MPRP
[record_solution.parameters]
trigger = "The next run's situation in its own words — matched against the incoming directive at kickoff. Concrete symptoms, tool names, error text."
body = "The answer to inject verbatim: cause, fix, commands, paths, gotchas. Concrete and short."

[gh_post_comment]
description = "Post a comment on the inbound thread (PR for PR conversations/reviews, originating issue otherwise). Pass `number` ONLY to post elsewhere."

[gh_post_comment.parameters]
body = "Markdown comment body."
number = "Optional issue/PR override. Defaults to the inbound thread."

[gh_push_branch]
description = "Push the workspace branch to origin. Pre-publish gate (when the repo defines them): `bun run fix` → amend any formatter diff into your HEAD commit → `bun check`. On `bun check` failure, fix the cause and retry. Pre-existing breakage on `main` against the same paths NOT caused by your diff → say so in the follow-up comment and stop; only an explicit operator directive can grant a check bypass. Dirty-tree gate runs unconditionally. Commit messages carrying shell-literal `\\n` escapes are rewritten to real newlines before the push."

[gh_push_branch.parameters]
branch = "Optional branch override; defaults to the workspace branch."

[release_ci_status]
description = "Refresh every GitHub Actions run for the release tag's expected commit and list non-green jobs with failed steps. Release tasks only."

[release_job_log]
description = "Fetch the tail of one GitHub Actions job log when the failure dossier lacks enough detail. Release tasks only."

[release_job_log.parameters]
job_id = "GitHub Actions job id from the failure dossier or `release_ci_status`."
tail_lines = "Lines from the end of the log, 1-1000. Default 200."

[release_retag]
description = "Terminal release action: run the pre-publish gates, verify release invariants, then atomically push the default branch and move the release tag to the new HEAD. End the turn after success; the next CI verdict resumes the session."

[release_retag.parameters]
summary = "One sentence naming the root-cause fix and local verification completed this round."

[gh_open_pr]
description = "Open a PR from the workspace branch using the four-section body template. Pre-publish gate: `bun run fix` → amend formatter diff into HEAD → `bun check` → `bun run test`. No PR is created unless the full suite passes; on failure, fix and retry. Pre-existing `main` breakage NOT caused by your diff → document it in the PR's `## Verification` section and stop; only an explicit operator directive can grant a check bypass."

[gh_open_pr.parameters]
body = "Markdown body. MUST contain the four template sections in order: `## Repro`, `## Cause`, `## Fix`, `## Verification`."
base = "Optional base branch override (default: repo default)."

[gh_request_review]
description = "Request reviewers and/or add assignees on the open PR."

[gh_create_issue]
description = "File an issue for a real defect you found outside this task — in this repo or a declared dependency — instead of only calling it out of scope."

[gh_create_issue.parameters]
title = "Short, specific headline naming the symptom."
body = "What is broken, where you saw it, and the evidence (file:line, command output, link)."
repo = "Target repo. Defaults to the repo this run works on; only declared dependencies are accepted."
labels = "Labels to attach. Defaults to [\"carter-omp-finding\"]."

[repro_record]
description = "Persist a reproduction transcript (command, output, exit code) for the issue."

[repro_record.parameters]
reproduced = "True when the recorded run demonstrates the bug."

[mark_unable_to_reproduce]
description = "Ask the reporter for missing reproduction details, mark the issue `needs_info`, and keep the session resumable for the next reply."

[abort_task]
description = "Irrecoverably abandon this task WITHOUT posting any visible message. Use ONLY for orchestrator/environment defects you cannot work around (broken filesystem permissions, missing system tools, corrupted git metadata, harness bugs). NEVER for normal workflow problems: failed builds and unclear maintainer requests use `gh_post_comment`; missing reporter reproduction details use `mark_unable_to_reproduce`. `reason` is audit-only and NEVER shown to the reporter."

[abort_task.parameters]
reason = "Internal diagnosis for the operator. Concrete, specific, blameless. NEVER shown to the reporter."

[fetch_issue_thread]
description = "Refetch the originating issue and its comments. Use sparingly."

[gh_search_issues]
description = "Search issues AND pull requests in the current repo. Served from a local index of every issue/PR (webhook-fed, periodically reconciled), so calls are free — search liberally during triage to find duplicates and already-merged fixes before classifying."

[gh_search_issues.parameters]
query = "GitHub issue-search syntax: bare keywords plus qualifiers like `is:pr`, `is:closed`, `is:merged`, `label:bug`, `author:<login>`. NEVER include a `repo:` qualifier — scope is applied automatically."
limit = "Max results, 1-20. Default 10."

[search_commits]
description = "Search the default branch's commit history. `mode=message` greps commit messages (case-insensitive regex); `mode=patch` finds commits whose diff adds/removes the literal query string — use it to check whether the broken code path was already touched by a fix."

[search_commits.parameters]
query = "Regex for `mode=message`; literal string for `mode=patch`."
mode = "`message` (default) searches commit messages; `patch` pickaxe-searches diff content."
paths = "Optional path filters (files or directories) to narrow the walk."
limit = "Max commits, 1-30. Default 10."

[set_issue_labels]
description = "Append labels to the originating issue/PR. NEVER removes existing labels."

[set_issue_labels.parameters]
number = "Optional override; defaults to the originating issue."

[classify_issue]
description = "First triage step. Classify the issue, apply labels on GitHub, pick the workflow branch (bug → repro+fix+PR, question → reply only, etc.). MUST be called before any other `gh_*` action on a new issue."

[classify_issue.parameters]
primary = "Exactly one primary classification."
priority = "REQUIRED when `primary=='bug'`; one of `prio:p0..p3`. Omit the field for any other primary — orchestrator silently drops stray values."
functional = "Zero or more functional labels. Unknown values dropped silently; omit the field when none apply."
provider = "Only when provider-scoped; format `provider:<name>`. Omit otherwise."
platform = "Only when platform materially affects reproduction; one of `platform:linux|macos|windows|wsl`. Omit otherwise."
rationale = "One sentence explaining the classification."
branch_slug = "Kebab-case slug, 1-50 chars `[a-z0-9-]`, no leading/trailing/double hyphen. Replaces the auto-generated slug in the working branch name. Provide for `bug`/`documentation`. Omit for non-PR workflows (`question`, `enhancement`, `proposal`, `wontfix`, `invalid`, `duplicate`)."

[classify_issue.next_steps]
bug = "reproduce → diagnose → fix → PR"
wontfix = "post one gh_post_comment explaining the design rationale or upstream cause and what evidence would change the assessment; no repro, no PR; the maintainer decides whether to close"
documentation = "fix the docs and open a PR using the four-section template"
question = "answer in a single gh_post_comment; no PR, no repro"
enhancement = "post one thoughtful gh_post_comment on feasibility/scope; no PR"
proposal = "post one thoughtful gh_post_comment on feasibility/scope; no PR"
invalid = "post one explanatory gh_post_comment; no further action"
duplicate = "post one explanatory gh_post_comment; no further action"

[revise_issue_assessment]
description = "Correct an earlier classification once new evidence contradicts it. Records the old and new labels plus the evidence and swaps the mutually exclusive primary label. Use instead of re-calling classify_issue (which is a no-op after the first call)."

[revise_issue_assessment.parameters]
primary = "The corrected primary classification."
rationale = "One sentence naming the fact that rules out the previous label."
evidence = "What you observed that contradicts the earlier classification (command, output, code path)."

[run_reproduction]
description = "Execute a reproduction command in the worktree and record the REAL exit code, output, and HEAD SHA. Use this instead of hand-writing output into repro_record: the evidence must come from the process, not the model."

[run_reproduction.parameters]
command = "Shell command run from the worktree root (bash -lc)."
title = "Short label for the transcript file."
timeout_seconds = "Hard timeout in seconds (5-900, default 300). A timeout is recorded as timed_out with no exit code."
