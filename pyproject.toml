[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "carter-omp"
version = "0.1.0"
description = "Self-hosted GitHub triage/fix bot driving omp --mode rpc (explicit-trigger security model)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Stencil Labs, Inc." }]
dependencies = [
  "fastapi>=0.112",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "python-dotenv>=1.0",
  "click>=8.1",
  "omp-rpc>=0.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "ruff>=0.13",
  "mypy>=1.11",
  "vulture>=2.11",
  "bandit>=1.7",
  "pip-audit>=2.7",
]

[project.scripts]
carter-omp = "carter_omp.cli:main"

[tool.setuptools]
package-dir = { "carter_omp" = "src/carter_omp" }
packages = ["carter_omp", "carter_omp.proxy"]

[tool.setuptools.package-data]
carter_omp = ["prompts/*", "py.typed", "static/*", "static/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [".pi-context", "data", "vendor"]

[tool.ruff.lint]
select = [
  "E", "W",  # pycodestyle
  "F",       # pyflakes
  "I",       # isort
  "UP",      # pyupgrade
  "B",       # flake8-bugbear
  "C4",      # comprehensions
  "PIE",     # misc lints
]
ignore = [
  "E501",  # long lines (embedded HTML/SQL/prompts); formatter handles real cases
  "B008",  # FastAPI/Click rely on call-in-defaults (Depends, Option)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # assert False is fine in tests

[tool.ruff.lint.isort]
known-first-party = ["carter_omp"]

[tool.ruff.format]
quote-style = "double"

[tool.uv.sources]
omp-rpc = { path = "vendor/omp-rpc", editable = false }

[tool.coverage.run]
source = ["src/carter_omp"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "@overload",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
# Baseline: 19 known errors (6 files) as of 2026-09-24 — mostly vendored-RPC
# generic variance, Optional-narrowing, and Row-type unions. Fix incrementally;
# do not add new errors (`mypy src/carter_omp` count must not exceed 19).
# See docs/agent-notes.md.
show_error_codes = true

[tool.bandit]
exclude_dirs = ["tests", "vendor"]
# B101 assert_used: asserts are input validation, never security checks.
# B104 bind-all: intentional, isolation is via compose (no ports mapping).
# B404/B603/B607 subprocess: the agent runner shells git/pytest by design;
#   commands are allowlisted argv arrays, never shell=True with untrusted input.
# B608 SQL: queries use ?-bound params; f-strings assemble static fragments
#   plus quoted FTS terms (see issue_index quoting). B105/B311: no real
#   credentials or tokens in flagged strings (header names, 'https' literals).
skips = ["B101", "B104", "B404", "B603", "B607", "B608", "B105", "B311"]

[tool.vulture]
min_confidence = 90
ignore_names = ["cls"]
