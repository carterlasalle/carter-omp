# trace:v1 id=impl.upstream-watch-name work=WORK-CO-Q8Z1HJJJ
name: upstream-watch

# trace:v1 id=impl.upstream-watch-on work=WORK-CO-Q8Z1HJJJ
on:
  schedule:
    # Daily 13:00 UTC.
    - cron: "0 13 * * *"
  workflow_dispatch:

# trace:v1 id=impl.upstream-watch work=WORK-CO-Q8Z1HJJJ implements=PLAN-CO-YFKQADAY
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find new upstream commits
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          UPSTREAM="can1357/oh-my-pi"
          KNOWN_FILE="docs/upstream.md"
          KNOWN=$(grep -oE 'Upstream commit used for extraction: `[0-9a-f]{40}`' "$KNOWN_FILE" | grep -oE '[0-9a-f]{40}' | head -1)
          if [ -z "$KNOWN" ]; then
            echo "$KNOWN_FILE has no 'Upstream commit used for extraction' line; cannot diff" >&2
            exit 1
          fi
          # Every hash already recorded in the file counts as seen.
          SEEN="$KNOWN $(grep -oE '\b[0-9a-f]{40}\b' "$KNOWN_FILE" | sort -u | tr '\n' ' ')"
          # Per-path commit lists instead of one giant `compare`: a compare
          # spanning weeks of a monorepo returns no file list (and the old
          # version swallowed that with `|| true`, so the watch went green and
          # did nothing). Path-scoped commits are bounded and reliable.
          RECENT="$(gh api "repos/$UPSTREAM/commits?path=python/robomp&sha=main&per_page=30" --jq '.[] | "\(.sha) \(.commit.message | split("\n")[0])"')"
          RECENT_IPC="$(gh api "repos/$UPSTREAM/commits?path=python/omp-rpc&sha=main&per_page=30" --jq '.[] | "\(.sha) \(.commit.message | split("\n")[0])"')"
          NEW=""
          while read -r sha subject; do
            [ -n "$sha" ] || continue
            if ! echo "$SEEN" | grep -qw "$sha"; then
              NEW="${NEW}${sha} ${subject}"$'\n'
            fi
          done <<< "$(printf '%s\n%s\n' "$RECENT" "$RECENT_IPC")"
          NEW="$(printf '%s' "$NEW" | head -10)"
          if [ -z "$NEW" ]; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "no new upstream commits since $KNOWN"
            exit 0
          fi
          HEAD_SHA="$(printf '%s' "$NEW" | head -1 | cut -d' ' -f1)"
          echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "known=$KNOWN" >> "$GITHUB_OUTPUT"
          # Files each new commit touched under the vendored paths (bounded).
          CHANGED="$(for sha in $(printf '%s' "$NEW" | cut -d' ' -f1); do
              gh api "repos/$UPSTREAM/commits/$sha" \
                --jq '.files[]?.filename | select(startswith("python/robomp") or startswith("python/omp-rpc"))'
            done | sort -u)"
          LOG="$NEW"$'\n\n'"Files changed since extraction:"$'\n'"$CHANGED"
          {
            echo "new=true"
            echo "log<<EOF"
            echo "$LOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Open tracking issue
        if: steps.upstream.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HEAD_SHA="${{ steps.upstream.outputs.head }}"
          # Skip if an open issue already tracks this exact HEAD.
          if gh issue list --search "upstream $HEAD_SHA in:title" --state open --json number --jq '.[0].number' | grep -qE '^[0-9]+$'; then
            echo "tracking issue already open for $HEAD_SHA"
            exit 0
          fi
          gh issue create \
            --title "Upstream robomp changed ($HEAD_SHA)" \
            --label "upstream-watch" \
            --body "oh-my-pi \`python/robomp\` (and/or \`python/omp-rpc\`) has new commits since our extraction point.

          Extraction point: see \`docs/upstream.md\`.
          Upstream HEAD touching \`python/robomp\`: \`$HEAD_SHA\`

          Recent commits:
          ${{ steps.upstream.outputs.log }}

          Compare: https://github.com/can1357/oh-my-pi/compare/\${{ steps.upstream.outputs.known }}...\${{ steps.upstream.outputs.head }}

          To triage: review the diff for behavior/security impact on our explicit-trigger contract. To port: \`@carter-omp cherry-pick the <sha> changes into carter_omp per docs/upstream.md\`, then record the hash under \"Later upstream commits\" in \`docs/upstream.md\`."
