name: ci

on:
  push:
  pull_request:

# trace:v1 id=impl.ci-jobs work=WORK-CO-Q8Z1HJJJ implements=PLAN-CO-YFKQADAY
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-extras --frozen
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run pytest -q -p no:cacheprovider --ignore=tests/test_worker_smoke.py
      - run: uv run pytest -q -p no:cacheprovider --ignore=tests/test_worker_smoke.py --cov=src/carter_omp --cov-report=term-missing --cov-fail-under=70
      - run: uv run mypy src/carter_omp
      - run: uv run vulture src/carter_omp
      - run: uv run bandit -q -r src/carter_omp
      - run: uv run pip-audit

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable
      - working-directory: web
        run: yarn install --immutable
      - working-directory: web
        run: yarn lint
      - working-directory: web
        run: yarn typecheck
      - working-directory: web
        run: yarn test
      - working-directory: web
        run: yarn build

  docker:
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t carter-omp:ci .

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python, javascript
      - uses: github/codeql-action/analyze@v3
